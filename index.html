<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestionale - La Casereccia</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <h1>🍝 Pasta Fresca La Casereccia</h1>

            <p class="subtitle">
                Gestionale Aziendale
            </p>

            <h2>Dove vuoi accedere?</h2>

            <button onclick="accessoPrincipale()">
                🏢 Sede Principale
            </button>

            <button onclick="accessoSede('senigallia')">
                📍 Senigallia
            </button>

            <button onclick="accessoSede('marotta')">
                📍 Marotta
            </button>

            <div id="loginPrincipale" class="login-form">

                <h3>Accesso Sede Principale</h3>

                <input
                    type="text"
                    id="username"
                    placeholder="Nome utente"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                >

                <button onclick="loginPrincipale()">
                    ACCEDI
                </button>

                <p id="errore"></p>

            </div>

        </div>

    </div>

    <script>

        function accessoPrincipale() {

            document.getElementById("loginPrincipale").style.display = "block";

        }

        function accessoSede(sede) {

            if (sede === "senigallia") {
                alert("Accesso a Senigallia");
            }

            if (sede === "marotta") {
                alert("Accesso a Marotta");
            }

        }

        function loginPrincipale() {

            alert("Il sistema di autenticazione verrà collegato al database.");

        }

    </script>

</body>
</html>
